name: ML Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # ---- MLflow fix: create clean folders ----
    - name: Prepare MLflow directories
      run: |
        rm -rf mlruns        # supprime ton dossier local commité (sinon MLflow plante)
        mkdir -p mlruns
        mkdir -p artifacts

    # ---- Run main pipeline ----
    - name: Run full pipeline
      run: python main.py

